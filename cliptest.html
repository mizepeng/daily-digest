<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日早报 · 游戏与 AI</title>
<meta name="description" content="每天早上 8 点更新的游戏与 AI 资讯。">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&family=Unbounded:wght@500;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Magazine layout: masthead with an oversized gradient date, then two channels,
   each opened by a full-bleed colour band; lead story as a big image card,
   the other headlines as an image grid, then a numbered list and a compact ticker.
   Games = ember (tomato -> amber, scanlines), AI = signal (cobalt -> cyan, dot grid). */
:root {
  --bg: #eceef2;
  --paper: #ffffff;
  --paper-2: #f6f7f9;
  --ink: #101217;
  --muted: #586070;
  --faint: #7d8494;
  --line: #d9dde4;
  --shadow: 0 1px 2px rgba(16,18,23,.06), 0 8px 24px -12px rgba(16,18,23,.18);
  --g1: #f2541b; --g2: #ffad1f; --g-deep: #2b0b02; --g-ink: #c2410c; --g-soft: #fff0e6;
  --a1: #3651f5; --a2: #10b8d4; --a-deep: #050a2c; --a-ink: #2f47d9; --a-soft: #e8edff;
  --mine: #0c7a53; --mine-soft: #d8f3e7;
  --on-img: #ffffff;
  --pressed-ink: #ffffff; --pressed-bg: #101217;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-head: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-disp: "Unbounded", "Noto Sans SC", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c10; --paper: #14161c; --paper-2: #1a1d24; --ink: #eef0f4; --muted: #a3aab8; --faint: #7a8191; --line: #262a33;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    --g-ink: #ff8a50; --g-soft: #2a160d; --a-ink: #8fa2ff; --a-soft: #141a38;
    --mine: #48d29c; --mine-soft: #0f2d23;
    --pressed-ink: #0b0c10; --pressed-bg: #eef0f4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c10; --paper: #14161c; --paper-2: #1a1d24; --ink: #eef0f4; --muted: #a3aab8; --faint: #7a8191; --line: #262a33;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --g-ink: #ff8a50; --g-soft: #2a160d; --a-ink: #8fa2ff; --a-soft: #141a38;
  --mine: #48d29c; --mine-soft: #0f2d23;
  --pressed-ink: #0b0c10; --pressed-bg: #eef0f4; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 120px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.7 var(--f-body);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--a1); outline-offset: 3px; border-radius: 6px; }
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- masthead ---------- */
.mast {
  position: relative; overflow: hidden;
  padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
  padding-bottom: 28px;
  border-bottom: 1px solid var(--line);
}
.mast::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(60% 120% at 100% 0%, color-mix(in srgb, var(--a1) 22%, transparent), transparent 60%),
    radial-gradient(50% 110% at 0% 100%, color-mix(in srgb, var(--g1) 20%, transparent), transparent 60%);
}
.mast .wrap { position: relative; display: grid; gap: 18px; }
.mast-top {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  font: 700 11px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
}
.mast-top .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.mast-top .brand img { width: 30px; height: 30px; border-radius: 8px; box-shadow: 0 4px 14px -4px rgba(54,81,245,.5); }
.mast-title { display: flex; align-items: flex-end; gap: 6px 18px; flex-wrap: wrap; }
.mast-date {
  font: 800 clamp(64px, 17vw, 148px)/.9 var(--f-disp); letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(100deg, var(--g1) 0%, var(--g2) 32%, var(--a2) 68%, var(--a1) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  /* room for glyph overhang: the clip box is narrower than the digits with negative tracking */
  padding: .08em .12em .06em .02em; margin: -.08em -.06em -.06em -.02em;
}
.mast-word { display: grid; gap: 2px; padding-bottom: 8px; }
.mast-word b { font: 900 clamp(30px, 7vw, 52px)/1 var(--f-head); letter-spacing: .02em; }
.mast-word span { font: 500 13px/1.4 var(--f-body); color: var(--muted); }
.heads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.head-link {
  min-width: 0; display: grid; gap: 4px; text-decoration: none;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  box-shadow: var(--shadow); transition: transform .2s ease;
}
.head-link:hover { transform: translateY(-2px); }
.head-link small { font: 700 10.5px/1 var(--f-mono); letter-spacing: .16em; }
.head-link.games small { color: var(--g-ink); }
.head-link.ai small { color: var(--a-ink); }
.head-link span { font: 700 15px/1.45 var(--f-head); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- sticky bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 10;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; flex-wrap: wrap; }
.seg { display: flex; gap: 2px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  font: 500 14px/1 var(--f-body); color: var(--muted); background: none; border: 0;
  padding: 9px 16px; border-radius: 999px; cursor: pointer; display: flex; gap: 7px; align-items: center;
  transition: background .2s, color .2s;
}
.seg button .n { font: 700 11px/1 var(--f-mono); opacity: .75; }
.seg button[aria-pressed="true"] { color: var(--pressed-ink); background: var(--pressed-bg); }
.seg button[data-s="games"][aria-pressed="true"] { background: linear-gradient(120deg, var(--g1), var(--g2)); color: #fff; }
.seg button[data-s="ai"][aria-pressed="true"] { background: linear-gradient(120deg, var(--a1), var(--a2)); color: #fff; }
.days { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.days > button {
  font: 500 16px/1 var(--f-mono); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 999px; width: 38px; height: 38px; cursor: pointer;
  display: grid; place-items: center; transition: border-color .2s, background .2s;
}
.days > button:hover:not(:disabled) { border-color: var(--ink); }
.days > button:disabled { opacity: .3; cursor: default; }
.picker { position: relative; }
.pick-btn {
  display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 12px 0 10px;
  font: 600 14px/1 var(--f-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: border-color .2s, box-shadow .2s;
}
.pick-btn:hover, .pick-btn[aria-expanded="true"] { border-color: var(--ink); }
.pick-btn:focus-visible, .days > button:focus-visible, .pick-opt:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
.pick-ico {
  width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, var(--g2), var(--g1) 40%, var(--a1) 75%, var(--a2)); color: #fff;
}
.pick-ico svg { width: 13px; height: 13px; }
.pick-wd { font: 500 12px/1 var(--f-body); color: var(--muted); }
.pick-chev { width: 14px; height: 14px; color: var(--muted); transition: transform .2s; margin-left: auto; }
.pick-btn[aria-expanded="true"] .pick-chev { transform: rotate(180deg); }
.pick-pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: 248px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 18px 48px -16px rgba(0,0,0,.45), var(--shadow); padding: 6px;
  transform-origin: top right; animation: pop .16s ease-out;
}
.pick-pop[hidden] { display: none !important; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.pick-head { font: 600 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 8px; }
.pick-list { list-style: none; margin: 0; padding: 0; max-height: min(320px, 55vh); overflow-y: auto; overscroll-behavior: contain; }
.pick-opt {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 11px; cursor: pointer; color: var(--ink);
}
.pick-opt:hover, .pick-opt.active { background: var(--paper-2); }
.pick-day { font: 700 20px/1 var(--f-display); text-align: center; letter-spacing: -.02em; }
.pick-day small { display: block; font: 600 10px/1 var(--f-mono); color: var(--muted); margin-top: 4px; letter-spacing: .04em; }
.pick-txt { font: 500 14px/1.25 var(--f-body); }
.pick-txt span { display: block; font: 400 12px/1.3 var(--f-body); color: var(--muted); }
.pick-tag { font: 700 10px/1 var(--f-mono); letter-spacing: .06em; padding: 5px 7px; border-radius: 999px; color: var(--muted); border: 1px solid var(--line); }
.pick-opt[aria-selected="true"] { background: linear-gradient(120deg, color-mix(in srgb, var(--g1) 14%, transparent), color-mix(in srgb, var(--a1) 14%, transparent)); }
.pick-opt[aria-selected="true"] { box-shadow: inset 3px 0 0 var(--g1); }
.pick-opt[aria-selected="true"] .pick-day { color: var(--g1); }

/* ---------- sections ---------- */
main { padding-block: 28px 56px; display: grid; gap: 56px; }
.sec { display: grid; gap: 28px; min-width: 0; }
.sec.games { --c1: var(--g1); --c2: var(--g2); --deep: var(--g-deep); --cink: var(--g-ink); --soft: var(--g-soft); }
.sec.ai { --c1: var(--a1); --c2: var(--a2); --deep: var(--a-deep); --cink: var(--a-ink); --soft: var(--a-soft); }

.opener {
  position: relative; overflow: hidden; border-radius: 20px; color: var(--on-img);
  padding: 26px 24px 22px; min-height: 168px;
  display: grid; align-content: end; gap: 6px;
  background: linear-gradient(125deg, var(--deep) 0%, color-mix(in srgb, var(--c1) 85%, var(--deep)) 55%, var(--c2) 120%);
  isolation: isolate;
}
.opener::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .6; }
.games .opener::before {
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 85% 30%, rgba(255,210,120,.55), transparent 42%);
}
.ai .opener::before {
  background:
    radial-gradient(circle, rgba(255,255,255,.24) 1px, transparent 1.4px) 0 0 / 14px 14px,
    radial-gradient(circle at 82% 35%, rgba(120,230,255,.5), transparent 45%);
  -webkit-mask-image: linear-gradient(100deg, transparent 10%, #000 70%); mask-image: linear-gradient(100deg, transparent 10%, #000 70%);
}
.opener .ghost {
  position: absolute; right: -8px; top: -14px; z-index: -1;
  font: 800 clamp(72px, 16vw, 150px)/1 var(--f-disp); letter-spacing: -.05em;
  color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.3);
}
.opener .kick { font: 700 11px/1 var(--f-mono); letter-spacing: .2em; opacity: .85; }
.opener h2 { margin: 0; font: 900 clamp(40px, 10vw, 64px)/1 var(--f-head); letter-spacing: .04em; }
.opener .stats { display: flex; gap: 14px; flex-wrap: wrap; font: 500 12px/1 var(--f-mono); opacity: .92; margin-top: 6px; }
.opener .stats b { font-weight: 700; }

.tier-h {
  display: flex; align-items: center; gap: 10px; margin: 0;
  font: 700 12px/1 var(--f-mono); letter-spacing: .2em; color: var(--muted);
}
.tier-h::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.tier-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tier { display: grid; gap: 14px; min-width: 0; }

/* media + fallback art */
.media { position: relative; overflow: hidden; background: var(--paper-2); aspect-ratio: 16 / 9; }
.media img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
a.card:hover .media img, a.lead:hover .media img { transform: scale(1.04); }
.art {
  position: absolute; inset: 0; display: grid; place-items: center;
  background:
    radial-gradient(120% 90% at var(--x, 80%) var(--y, 20%), color-mix(in srgb, var(--c2) 70%, transparent), transparent 55%),
    linear-gradient(135deg, var(--deep), color-mix(in srgb, var(--c1) 80%, var(--deep)));
  color: var(--on-img);
}
.games .art::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(-45deg, rgba(255,255,255,.06) 0 2px, transparent 2px 12px);
}
.ai .art::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,.2) 1px, transparent 1.3px) 0 0 / 12px 12px;
  -webkit-mask-image: radial-gradient(circle at var(--x, 80%) var(--y, 20%), #000, transparent 70%); mask-image: radial-gradient(circle at var(--x, 80%) var(--y, 20%), #000, transparent 70%);
}
.art .glyph { position: relative; z-index: 1; font: 800 clamp(34px, 7vw, 60px)/1 var(--f-disp); letter-spacing: -.04em; opacity: .92; }
.art .asrc { position: absolute; z-index: 1; left: 14px; bottom: 12px; font: 700 10.5px/1 var(--f-mono); letter-spacing: .14em; opacity: .8; }

.tag {
  font: 700 11px/1 var(--f-body); padding: 5px 8px; border-radius: 6px;
  background: var(--mine-soft); color: var(--mine); white-space: nowrap;
}
.media .tag { position: absolute; left: 12px; top: 12px; z-index: 3; background: #0c7a53; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font: 500 12px/1.4 var(--f-mono); color: var(--faint); }
.meta .src { color: var(--muted); }
.meta .date { font-variant-numeric: tabular-nums; color: var(--cink); font-weight: 700; }

/* lead story */
.lead {
  display: grid; text-decoration: none; background: var(--paper); border-radius: 18px; overflow: hidden;
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
.lead .media { aspect-ratio: 16 / 8; }
.lead .media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,.8)); pointer-events: none; z-index: 1; }
.lead .over { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 18px 20px; color: var(--on-img); display: grid; gap: 6px; }
.lead .over .k { font: 700 10.5px/1 var(--f-mono); letter-spacing: .2em; opacity: .85; }
.lead .over h3 { margin: 0; font: 900 clamp(22px, 4.6vw, 34px)/1.3 var(--f-head); text-wrap: balance; text-shadow: 0 2px 16px rgba(0,0,0,.45); }
.lead .body { padding: 14px 20px 18px; display: grid; gap: 8px; }
.lead .body p { margin: 0; color: var(--muted); font-size: 15.5px; }

/* important grid */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card {
  min-width: 0; display: grid; grid-template-rows: auto 1fr; text-decoration: none;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  box-shadow: var(--shadow); transition: transform .25s ease;
}
.card:hover { transform: translateY(-3px); }
.grid > .card:last-child:nth-child(odd) { grid-column: 1 / -1; }
.grid > .card:last-child:nth-child(odd) .media { aspect-ratio: 21 / 8; }
.card .body { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.card h3 { margin: 0; font: 700 18px/1.45 var(--f-head); text-wrap: pretty; }
.card p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.65; }

/* notable list */
.nlist { list-style: none; margin: 0; padding: 0; display: grid; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.nrow { border-top: 1px solid var(--line); min-width: 0; }
.nrow:first-child { border-top: 0; }
.nrow a { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px; text-decoration: none; transition: background .2s; }
.nrow a:hover { background: var(--soft); }
.nrow .idx { font: 800 22px/1 var(--f-disp); color: transparent; -webkit-text-stroke: 1.2px var(--cink); min-width: 2ch; padding-top: 4px; }
.nrow .txt { min-width: 0; display: grid; gap: 4px; }
.nrow h4 { margin: 0; font: 700 16.5px/1.45 var(--f-head); }
.nrow p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
.nrow .thumb { width: 112px; aspect-ratio: 4 / 3; border-radius: 10px; }

/* brief ticker */
.blist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.blist li { min-width: 0; border-top: 1px dashed var(--line); }
.blist a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 12px 2px; text-decoration: none; }
.blist .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 10px; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.blist h5 { margin: 0; font: 700 15px/1.5 var(--f-body); }
.blist a:hover h5 { color: var(--cink); }
.blist p { margin: 2px 0 4px; color: var(--muted); font-size: 13.5px; line-height: 1.6; }

.ext::after { content: "↗"; font: 500 .7em/1 var(--f-mono); margin-left: 4px; opacity: .5; vertical-align: .15em; }

.state { padding: 64px 0; text-align: center; color: var(--muted); }
footer { padding-block: 0 48px; color: var(--faint); font-size: 12.5px; }
footer .wrap > div { border-top: 1px solid var(--line); padding-top: 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
footer p { margin: 0; }

/* entrance: transform only, never hidden */
@keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
.sec > * { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
.sec > *:nth-child(2) { animation-delay: .05s; }
.sec > *:nth-child(3) { animation-delay: .1s; }
.sec > *:nth-child(4) { animation-delay: .15s; }

@media (max-width: 680px) {
  .grid, .blist { grid-template-columns: minmax(0, 1fr); }
  .grid > .card:last-child:nth-child(odd) .media { aspect-ratio: 16 / 9; }
  .heads { grid-template-columns: minmax(0, 1fr); }
  .lead .media { aspect-ratio: 4 / 3; }
  .nrow .thumb { width: 88px; }
  .nrow a { gap: 12px; padding: 14px; }
}
@media (max-width: 520px) {
  .bar .wrap { gap: 8px; }
  .seg { width: 100%; }
  .seg button { flex: 1; justify-content: center; padding: 9px 8px; }
  .days { margin-left: 0; width: 100%; }
  .picker { flex: 1; min-width: 0; }
  .pick-btn { width: 100%; }
  .pick-pop { left: 0; right: 0; width: auto; transform-origin: top center; }
  .opener { padding: 22px 18px 18px; min-height: 148px; border-radius: 16px; }
  .nrow .idx { display: none; }
  .nrow a { grid-template-columns: minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
